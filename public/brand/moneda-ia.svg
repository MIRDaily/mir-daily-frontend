<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 67 67">
  <defs>
    <linearGradient id="canto" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE68F"/>
      <stop offset="0.55" stop-color="#E9AE2E"/>
      <stop offset="1" stop-color="#B37310"/>
    </linearGradient>
    <radialGradient id="cara" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFF4C4"/>
      <stop offset="0.45" stop-color="#F8CD52"/>
      <stop offset="0.85" stop-color="#E2A52A"/>
      <stop offset="1" stop-color="#C58615"/>
    </radialGradient>
  </defs>
  <!-- Canto -->
  <!-- Sombra dura (como las tarjetas) y canto -->
  <circle cx="34.4" cy="36" r="30" fill="#2C3E50"/>
  <circle cx="32" cy="34.4" r="30" fill="#B37310" stroke="#2C3E50" stroke-width="2"/>
  <circle cx="32" cy="32" r="30" fill="url(#canto)" stroke="#2C3E50" stroke-width="2"/>
  <!-- Estriado del canto -->
  <circle cx="32" cy="32" r="27.6" fill="none" stroke="#9A6508" stroke-width="1.6" stroke-dasharray="1.1 1.7" opacity="0.55"/>
  <!-- Cara de la moneda -->
  <circle cx="32" cy="32" r="25.4" fill="url(#cara)" stroke="#A86F0C" stroke-width="1.2"/>
  <!-- Cabeza del fago: icosaedro en relieve -->
  <g stroke-linejoin="round">
    <polygon points="32,16.5 19,24 30.5,30" fill="#FFE99E"/>
    <polygon points="32,16.5 45,24 30.5,30" fill="#FFD866"/>
    <polygon points="45,24 45,39 30.5,30" fill="#F1B53A"/>
    <polygon points="45,39 32,46.5 30.5,30" fill="#D8961F"/>
    <polygon points="32,46.5 19,39 30.5,30" fill="#E6A82D"/>
    <polygon points="19,39 19,24 30.5,30" fill="#FBCF63"/>
    <g stroke="#C08214" stroke-width="0.6" opacity="0.7" fill="none">
      <path d="M30.5 30 L32 16.5 M30.5 30 L45 24 M30.5 30 L45 39 M30.5 30 L32 46.5 M30.5 30 L19 39 M30.5 30 L19 24"/>
    </g>
    <polygon points="32,16.5 45,24 45,39 32,46.5 19,39 19,24" fill="none" stroke="#7A4E05" stroke-width="1.7"/>
  </g>
  <!-- Brillo -->
  <path d="M23.6 23.6 L28.4 20.9" stroke="#FFFBEA" stroke-width="2" stroke-linecap="round"/>
  <circle cx="31" cy="19.4" r="0.9" fill="#FFFBEA"/>
  <!-- Carita (se quita en tamaños pequeños) -->
  <g class="cara">
    <ellipse cx="27.6" cy="33" rx="1.55" ry="1.95" fill="#5A3602"/>
    <ellipse cx="35.4" cy="33" rx="1.55" ry="1.95" fill="#5A3602"/>
    <circle cx="28.1" cy="32.3" r="0.5" fill="#FFF6D6"/>
    <circle cx="35.9" cy="32.3" r="0.5" fill="#FFF6D6"/>
    <path d="M29.2 37.2 Q31.5 39.3 33.8 37.2" fill="none" stroke="#5A3602" stroke-width="1.3" stroke-linecap="round"/>
  </g>
  <!-- Destello -->
  <path d="M50 11.5 L51 14.5 L54 15.5 L51 16.5 L50 19.5 L49 16.5 L46 15.5 L49 14.5 Z" fill="#FFF6CF" stroke="#C88A12" stroke-width="0.5"/>
</svg>
